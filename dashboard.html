<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // Aplica o tema salvo ANTES da primeira pintura da página - sem isso, o
    // navegador pinta com a paleta clara padrão do CSS e só troca pra escura
    // quando o módulo (assets/js/theme.js) termina de carregar, alguns
    // milissegundos depois - o "flash" de tema claro relatado. Mesma chave
    // e mesma regra de theme.js's inicializarTema() - mantenha as duas em
    // sincronia se uma mudar.
    (function () {
      var tema = localStorage.getItem('sindesk.tema');
      document.documentElement.setAttribute('data-theme', tema === 'dark' ? 'dark' : 'light');
    })();
  </script>
  <title>Sindesk Showcase — Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/images/sindesk_base.svg">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/shell.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/showcase.css">
</head>
<body>
  <canvas id="particles-canvas" aria-hidden="true"></canvas>
  <div class="glow-orb glow-orb--1" aria-hidden="true"></div>
  <div class="glow-orb glow-orb--2" aria-hidden="true"></div>

  <div class="app-shell">
    <div id="app-shell-header"></div>

    <div class="app-body">
      <div id="app-shell-nav"></div>

      <main class="app-main glass-card">
        <div id="conteudo-dashboard">
          <div class="pagina-cabecalho">
            <div>
              <h1>Dashboard</h1>
              <p class="subtitulo">Visão geral do sindicato.</p>
            </div>
          </div>

          <div class="secao-metricas">
            <div class="grade-metricas">
              <div class="cartao-metrica cartao-metrica--destaque">
                <span class="cartao-metrica-label">Total de filiados</span>
                <span class="cartao-metrica-valor" id="metrica-total">—</span>
              </div>
              <div class="cartao-metrica">
                <span class="cartao-metrica-label">Ativos</span>
                <span class="cartao-metrica-valor" id="metrica-ativos">—</span>
              </div>
              <div class="cartao-metrica">
                <span class="cartao-metrica-label">Inativos</span>
                <span class="cartao-metrica-valor" id="metrica-inativos">—</span>
              </div>
              <div class="cartao-metrica">
                <span class="cartao-metrica-label">Afastados</span>
                <span class="cartao-metrica-valor" id="metrica-afastados">—</span>
              </div>
              <div class="cartao-metrica">
                <span class="cartao-metrica-label">Aposentados</span>
                <span class="cartao-metrica-valor" id="metrica-aposentados">—</span>
              </div>
            </div>
          </div>

          <div class="secao-metricas">
            <h2>Movimentação e vigência</h2>
            <div class="grade-metricas">
              <div class="cartao-metrica">
                <span class="cartao-metrica-label">Novas filiações (mês atual)</span>
                <span class="cartao-metrica-valor" id="metrica-novas-filiacoes">—</span>
              </div>
              <div class="cartao-metrica">
                <span class="cartao-metrica-label">Vencimentos em 30 dias</span>
                <span class="cartao-metrica-valor" id="metrica-vencimentos-30">—</span>
              </div>
              <div class="cartao-metrica">
                <span class="cartao-metrica-label">Vencimentos em 60 dias</span>
                <span class="cartao-metrica-valor" id="metrica-vencimentos-60">—</span>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="assets/js/dashboard.js"></script>
  <script type="module" src="assets/js/showcase-banner.js"></script>
</body>
</html>
