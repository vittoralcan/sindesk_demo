<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // Aplica o tema salvo ANTES da primeira pintura da página - sem isso, o
    // navegador pinta com a paleta clara padrão do CSS e só troca pra escura
    // quando o módulo (assets/js/theme.js) termina de carregar, alguns
    // milissegundos depois - o "flash" de tema claro relatado. Mesma chave
    // e mesma regra de theme.js's inicializarTema() - mantenha as duas em
    // sincronia se uma mudar.
    (function () {
      var tema = localStorage.getItem('sindesk.tema');
      document.documentElement.setAttribute('data-theme', tema === 'dark' ? 'dark' : 'light');
    })();
  </script>
  <title>Sindesk Showcase — Vencimentos Próximos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/images/sindesk_base.svg">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/shell.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/vencimentos-proximos.css">
  <link rel="stylesheet" href="assets/css/showcase.css">
</head>
<body>
  <canvas id="particles-canvas" aria-hidden="true"></canvas>
  <div class="glow-orb glow-orb--1" aria-hidden="true"></div>
  <div class="glow-orb glow-orb--2" aria-hidden="true"></div>

  <div class="app-shell">
    <div id="app-shell-header"></div>

    <div class="app-body">
      <div id="app-shell-nav"></div>

      <main class="app-main glass-card">
        <div class="cabecalho-fixo">
          <div class="pagina-cabecalho">
            <div>
              <h1>Vencimentos Próximos</h1>
              <p class="subtitulo">Filiados ativos com vigência a vencer dentro da janela escolhida.</p>
            </div>
          </div>

          <div class="barra-filtros">
            <div class="segmentado" id="atalhos-dias">
              <button type="button" class="chip" data-dias="30">30 dias</button>
              <button type="button" class="chip" data-dias="60">60 dias</button>
              <button type="button" class="chip" data-dias="90">90 dias</button>
            </div>
            <div class="input-group campo-dias-personalizado">
              <input type="number" id="input-dias-personalizado" min="1" max="180" placeholder="Outro (1-180)" aria-label="Número de dias personalizado, de 1 a 180">
              <i class="fa-solid fa-calendar-days left-icon" aria-hidden="true"></i>
            </div>
            <button type="button" class="btn-ghost" id="btn-aplicar-dias">Aplicar</button>
          </div>
        </div>

        <div class="tabela-wrapper">
          <table class="tabela">
            <thead>
              <tr>
                <th>Nome</th>
                <th>CPF</th>
                <th>Vigência Fim</th>
                <th>Dias para vencer</th>
              </tr>
            </thead>
            <tbody id="corpo-tabela"></tbody>
          </table>
        </div>

        <div id="area-paginacao" class="paginacao"></div>
      </main>
    </div>
  </div>

  <script type="module" src="assets/js/vencimentos-proximos.js"></script>
  <script type="module" src="assets/js/showcase-banner.js"></script>
</body>
</html>
