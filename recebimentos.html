<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // Aplica o tema salvo ANTES da primeira pintura da página - sem isso, o
    // navegador pinta com a paleta clara padrão do CSS e só troca pra escura
    // quando o módulo (assets/js/theme.js) termina de carregar, alguns
    // milissegundos depois - o "flash" de tema claro relatado. Mesma chave
    // e mesma regra de theme.js's inicializarTema() - mantenha as duas em
    // sincronia se uma mudar.
    (function () {
      var tema = localStorage.getItem('sindesk.tema');
      document.documentElement.setAttribute('data-theme', tema === 'dark' ? 'dark' : 'light');
    })();
  </script>
  <title>Sindesk Showcase — Recebimentos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/images/sindesk_base.svg">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/shell.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/recebimentos.css">
  <link rel="stylesheet" href="assets/css/showcase.css">
</head>
<body>
  <canvas id="particles-canvas" aria-hidden="true"></canvas>
  <div class="glow-orb glow-orb--1" aria-hidden="true"></div>
  <div class="glow-orb glow-orb--2" aria-hidden="true"></div>

  <div class="app-shell">
    <div id="app-shell-header"></div>

    <div class="app-body">
      <div id="app-shell-nav"></div>

      <main class="app-main glass-card">
        <div id="conteudo-recebimentos">
          <div class="cabecalho-fixo">
            <div class="pagina-cabecalho">
              <div>
                <h1>Recebimentos</h1>
                <p class="subtitulo">Lançamentos manuais do que cada empresa efetivamente repassou.</p>
              </div>
              <div class="acoes-recebimentos" id="acoes-recebimentos" hidden>
                <a href="importacao-recebimentos.html" class="btn-ghost btn-acao">
                  <i class="fa-solid fa-file-import" aria-hidden="true"></i> Importar extrato
                </a>
                <button type="button" class="btn-submit btn-acao" id="btn-novo-recebimento">
                  <i class="fa-solid fa-plus" aria-hidden="true"></i> Novo recebimento
                </button>
              </div>
            </div>

            <form id="form-filtros-recebimentos" class="barra-filtros">
              <div class="campo-formulario">
                <label for="filtro-empresa-select">Empresa</label>
                <div class="empresa-select" id="filtro-empresa-select"></div>
              </div>
              <div class="campo-formulario">
                <label for="filtro-competencia-recebimento">Competência</label>
                <input type="month" id="filtro-competencia-recebimento" pattern="\d{4}-\d{2}">
              </div>
              <div class="campo-formulario">
                <label for="filtro-data-inicio-recebimento">Recebido de</label>
                <input type="date" id="filtro-data-inicio-recebimento">
              </div>
              <div class="campo-formulario">
                <label for="filtro-data-fim-recebimento">Recebido até</label>
                <input type="date" id="filtro-data-fim-recebimento">
              </div>
              <select id="filtro-origem-recebimento" class="select-filtro" aria-label="Filtrar por origem">
                <option value="">Todas as origens</option>
                <option value="MANUAL">Manual</option>
                <option value="IMPORTACAO">Importação</option>
                <option value="WEBHOOK">Webhook</option>
              </select>
              <select id="ordenar-recebimentos" class="select-filtro" aria-label="Ordenar por">
                <option value="-dataRecebimento">Mais recentes primeiro</option>
                <option value="dataRecebimento">Mais antigos primeiro</option>
                <option value="-valorCentavos">Maior valor primeiro</option>
              </select>
              <button type="submit" class="btn-ghost">
                <i class="fa-solid fa-filter" aria-hidden="true"></i> Filtrar
              </button>
            </form>
          </div>

          <div class="tabela-wrapper">
            <table class="tabela">
              <thead>
                <tr>
                  <th>Empresa</th>
                  <th>Competência</th>
                  <th>Valor</th>
                  <th>Data do recebimento</th>
                  <th>Origem</th>
                  <th>Descrição</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="corpo-tabela"></tbody>
            </table>
          </div>

          <div id="area-paginacao" class="paginacao"></div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="assets/js/recebimentos.js"></script>
  <script type="module" src="assets/js/showcase-banner.js"></script>
</body>
</html>
