<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // Aplica o tema salvo ANTES da primeira pintura da página - sem isso, o
    // navegador pinta com a paleta clara padrão do CSS e só troca pra escura
    // quando o módulo (assets/js/theme.js) termina de carregar, alguns
    // milissegundos depois - o "flash" de tema claro relatado. Mesma chave
    // e mesma regra de theme.js's inicializarTema() - mantenha as duas em
    // sincronia se uma mudar.
    (function () {
      var tema = localStorage.getItem('sindesk.tema');
      document.documentElement.setAttribute('data-theme', tema === 'dark' ? 'dark' : 'light');
    })();
  </script>
  <title>Sindesk Showcase — Espelho de Cobrança</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/images/sindesk_base.svg">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/shell.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/cobrancas-espelho.css">
  <link rel="stylesheet" href="assets/css/showcase.css">
</head>
<body>
  <canvas id="particles-canvas" aria-hidden="true"></canvas>
  <div class="glow-orb glow-orb--1" aria-hidden="true"></div>
  <div class="glow-orb glow-orb--2" aria-hidden="true"></div>

  <div class="app-shell">
    <div id="app-shell-header"></div>

    <div class="app-body">
      <div id="app-shell-nav"></div>

      <main class="app-main glass-card">
        <div id="conteudo-espelho">
          <div class="cabecalho-fixo">
            <div class="pagina-cabecalho">
              <div>
                <h1>Espelho de Cobrança</h1>
                <p class="subtitulo" id="espelho-subtitulo">Quanto cada empresa deveria repassar ao sindicato na competência.</p>
              </div>
              <button type="button" class="btn-submit btn-acao" id="btn-exportar-espelho-csv" hidden>
                <i class="fa-solid fa-file-arrow-down" aria-hidden="true"></i>
                <span id="texto-btn-exportar-espelho-csv">Exportar CSV</span>
              </button>
            </div>

            <form id="form-filtros-espelho" class="barra-filtros">
              <div class="campo-formulario">
                <label for="filtro-competencia-espelho">Competência</label>
                <input type="month" id="filtro-competencia-espelho" pattern="\d{4}-\d{2}" required>
              </div>
              <label class="campo-checkbox">
                <input type="checkbox" id="filtro-incluir-zerados">
                Incluir empresas sem filiado elegível
              </label>
              <button type="submit" class="btn-ghost">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i> Consultar
              </button>
            </form>
          </div>

          <div id="alerta-espelho" class="alert" role="alert" aria-live="polite">
            <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
            <span id="alerta-espelho-texto"></span>
          </div>

          <div id="area-resultado-espelho">
            <p class="subsecao-vazia" id="espelho-metadados"></p>

            <div class="secao-metricas" id="secao-totais-espelho"></div>

            <div class="secao-metricas">
              <h2>Inconsistências da competência</h2>
              <div id="area-inconsistencias-espelho"></div>
            </div>

            <div class="tabela-wrapper">
              <table class="tabela">
                <thead>
                  <tr>
                    <th>Empresa</th>
                    <th>CNPJ</th>
                    <th>Filiados</th>
                    <th>Valor total</th>
                  </tr>
                </thead>
                <tbody id="corpo-tabela"></tbody>
              </table>
            </div>

            <div id="area-paginacao" class="paginacao"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="assets/js/cobrancas-espelho.js"></script>
  <script type="module" src="assets/js/showcase-banner.js"></script>
</body>
</html>
